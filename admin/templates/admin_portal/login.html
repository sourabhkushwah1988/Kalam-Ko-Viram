<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Portal sign in | Kalam Ko Viram</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#090807;color:#ede7dc;font:14px/1.6 Arial,sans-serif}.login{width:min(420px,calc(100% - 32px));padding:32px;background:#12100e;border:1px solid rgba(201,163,92,.25);border-radius:6px}h1{font:500 28px Georgia,serif;color:#e8c98a;margin:0 0 4px}.muted{color:#9a9186;margin:0 0 24px}.field{margin:16px 0}.field label{display:block;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;background:#0c0b09;border:1px solid rgba(201,163,92,.25);border-radius:4px;padding:10px;color:#ede7dc}.errors{color:#f0a49a}.btn{width:100%;padding:11px;border:0;border-radius:4px;background:#c9a35c;color:#17120a;font-weight:bold;cursor:pointer}
</style></head>
<body><main class="login"><h1>Kalam Ko Viram</h1><p class="muted">Customer admin portal · Sign in with your staff account</p>
{% if form.non_field_errors %}<div class="errors">{{ form.non_field_errors }}</div>{% endif %}
<form method="post">{% csrf_token %}
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<div class="field"><label for="{{ form.username.id_for_label }}">Username</label>{{ form.username }}{{ form.username.errors }}</div>
<div class="field"><label for="{{ form.password.id_for_label }}">Password</label>{{ form.password }}{{ form.password.errors }}</div>
<button class="btn" type="submit">Sign in</button></form></main></body></html>
